<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Mapa de navegação: Xbox e adaptação para portfólio</title><desc id="desc">A Home conduz a biblioteca, loja, catálogo, busca e configurações. Guia sobrepõe o conteúdo. À direita, correspondências propostas para o portfólio.</desc>
<rect width="1500" height="850" fill="#101820"/><style>text{font:22px sans-serif;fill:#fff}.small{font:16px sans-serif;fill:#d6e8d6}.box{fill:#24362b;stroke:#66cf55;stroke-width:2}.proposal{fill:#202c3a;stroke:#61a5ff;stroke-width:2}.line{stroke:#a8d5a2;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8d5a2"/></marker></defs>
<text x="40" y="45">REFERÊNCIA XBOX — Home de 2023 e imagens fornecidas</text><text x="800" y="45">ADAPTAÇÃO PROPOSTA — portfólio</text>
<rect class="box" x="40" y="85" width="265" height="70" rx="8"/><text x="65" y="126">Home / início</text>
<rect class="box" x="40" y="205" width="265" height="70" rx="8"/><text x="65" y="246">Biblioteca</text><rect class="box" x="40" y="305" width="265" height="70" rx="8"/><text x="65" y="346">Store / catálogo</text><rect class="box" x="40" y="405" width="265" height="70" rx="8"/><text x="65" y="446">Game Pass</text><rect class="box" x="40" y="505" width="265" height="70" rx="8"/><text x="65" y="546">Busca</text><rect class="box" x="40" y="605" width="265" height="70" rx="8"/><text x="65" y="646">Configurações</text>
<rect class="box" x="380" y="205" width="300" height="110" rx="8"/><text x="400" y="244">Guia / sobreposição</text><text class="small" x="400" y="275">páginas vistas na imagem 5</text><rect class="box" x="380" y="405" width="300" height="110" rx="8"/><text x="400" y="444">Detalhe / busca</text><text class="small" x="400" y="475">imagens 8, 11 e 12: PC/loja</text>
<path class="line" d="M172 155V190M172 275V290M172 375V390M172 475V490M172 575V590M305 120H530V190M305 340H365V450"/>
<rect class="proposal" x="800" y="85" width="300" height="70" rx="8"/><text x="820" y="126">Início / destaques</text><rect class="proposal" x="800" y="205" width="300" height="70" rx="8"/><text x="820" y="246">Projetos e jogos</text><rect class="proposal" x="800" y="305" width="300" height="70" rx="8"/><text x="820" y="346">Projetos em detalhe</text><rect class="proposal" x="800" y="405" width="300" height="70" rx="8"/><text x="820" y="446">Experiências / jornada</text><rect class="proposal" x="800" y="505" width="300" height="70" rx="8"/><text x="820" y="546">Busca global</text><rect class="proposal" x="800" y="605" width="300" height="70" rx="8"/><text x="820" y="646">Preferências</text><rect class="proposal" x="1160" y="205" width="300" height="110" rx="8"/><text x="1180" y="244">Guia / contato / perfil</text><text class="small" x="1180" y="275">sobreposição acessível</text><rect class="proposal" x="1160" y="405" width="300" height="110" rx="8"/><text x="1180" y="444">Jogo / pausa / voltar</text><text class="small" x="1180" y="475">progresso local opcional</text>
<path class="line" d="M1100 120H1310V190M950 155V190M950 275V290M950 375V390M950 475V490M950 575V590M1100 240H1145M1100 340H1130V460H1145"/>
<text class="small" x="40" y="755">Verde: funções observadas; relações do Guia são simplificadas, não um inventário oficial completo.</text><text class="small" x="40" y="785">Azul: proposta para o portfólio. Versões do Xbox mudam entre console, PC e programas Insider.</text>
</svg>
